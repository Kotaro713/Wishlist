<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wishlist</title>

<!-- iPhoneのホーム画面に追加したときのアイコン設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wishlist">

<!-- アイコンに使う画像（もし独自の画像があればhrefを書き換えてください。今回は絵文字をベースにした綺麗に丸角になる設定です） -->
<link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1513519245088-0e12902e5a38?w=180&h=180&fit=crop">

<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<div class="header-flex">
  <h1>✨ Wishlist</h1>
</div>
<p class="sub">欲しい物を記録して、スマートに管理。</p>

<div class="stats">
<div class="stat"><small>未購入</small><strong id="count">0</strong></div>
<div class="stat"><small>未購入合計</small><strong id="total">¥0</strong></div>
<div class="stat"><small>購入済み</small><strong id="bought">0</strong></div>
<div class="stat"><small>購入済み合計</small><strong id="spent">¥0</strong></div>
</div>

<div class="grid">
<section class="card">
<h2 id="formTitle" style="margin:0 0 10px;font-size:16px">新しいアイテムを追加</h2>

<label>商品名 *</label>
<input id="name" placeholder="例：ワイヤレスイヤホン">

<label>価格 *</label>
<input id="price" type="number" min="0" placeholder="12000">

<label>商品URL</label>
<input id="url" type="url" placeholder="https://...">

<label>カテゴリ</label>
<input id="category" placeholder="例：電子機器">

<label>メモ</label>
<textarea id="memo" placeholder="色、サイズ、購入条件など"></textarea>

<label>商品画像</label>
<input id="image" type="file" accept="image/*" onchange="previewImage()">
<img id="preview" class="image-preview">

<label>欲しい度</label>
<select id="desire">
<option value="5">⭐⭐⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option>
<option value="3" selected>⭐⭐⭐</option><option value="2">⭐⭐</option><option value="1">⭐</option>
</select>

<label>購入優先度</label>
<select id="priority">
<option value="high">🔥 最優先</option>
<option value="medium" selected>🟡 欲しい</option>
<option value="low">⚪ いつか欲しい</option>
</select>

<label>状態</label>
<select id="status">
<option value="wanted">欲しい</option>
<option value="considering">検討中</option>
<option value="planned">購入予定</option>
<option value="bought">購入済み</option>
<option value="hold">保留</option>
<option value="lost">欲しくなくなった</option>
</select>

<label>購入予定日</label>
<input id="date" type="date">

<button class="primary" onclick="saveItem()">追加する</button>
<button id="cancel" style="display:none;width:100%;margin-top:7px;background:#eee;color:#333" onclick="cancelEdit()">編集をやめる</button>
</section>

<section>
<!-- カテゴリタブ表示エリア -->
<div id="categoryTabs" class="category-tabs"></div>

<div class="toolbar">
<input id="search" placeholder="検索..." oninput="onFilterChange()">
<select id="filterStatus" onchange="onFilterChange()">
<option value="all">すべて</option>
<option value="active">未購入</option>
<option value="bought">購入済み</option>
<option value="wanted">欲しい</option>
<option value="considering">検討中</option>
<option value="planned">購入予定</option>
<option value="hold">保留</option>
<option value="lost">欲しくなくなった</option>
</select>
<select id="sort" onchange="onFilterChange()">
<option value="manual">自分の順番</option>
<option value="priority">優先度順</option>
<option value="desire">欲しい度順</option>
<option value="priceAsc">価格が安い順</option>
<option value="priceDesc">価格が高い順</option>
<option value="date">購入予定日順</option>
<option value="new">新しく追加した順</option>
</select>
</div>

<!-- データ管理エリア -->
<div class="card" style="margin-bottom:12px; padding:12px; display:flex; gap:8px; align-items:center;">
<button onclick="exportData()" style="flex:1; background:var(--btn-bg); color:var(--text-color); font-size:12px; padding:10px; border:1px solid var(--border-color);">💾 バックアップ保存</button>
<button onclick="document.getElementById('importFile').click()" style="flex:1; background:var(--btn-bg); color:var(--text-color); font-size:12px; padding:10px; border:1px solid var(--border-color);">📂 復元する</button>
<input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
</div>

<div id="list"></div>
</section>
</div>
</div>

<div class="modal" id="modal">
<div class="modalbox">
<h3 style="margin-top:0;font-size:16px">削除しますか？</h3>
<p style="color:var(--sub-text);font-size:13px">この項目は元に戻せません。</p>
<div class="modal-actions">
<button onclick="closeModal()">キャンセル</button>
<button class="buy" onclick="confirmDelete()">削除</button>
</div>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
